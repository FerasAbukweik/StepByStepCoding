<header
  class="h-14 border-b border-borderPrimary px-4 md:px-6 flex items-center justify-between gap-3 bg-surface shrink-0"
>
  <div class="flex min-w-0 items-center gap-3">
    <button
      type="button"
      class="md:hidden icon-button"
      aria-label="Open navigation"
      (click)="menu.emit()"
    >
      <app-icon name="menu" />
    </button>
    <div class="flex items-center gap-2 whitespace-nowrap text-xs font-mono text-textSecondary">
      <span class="hidden sm:inline text-textMuted">
        {{ auth.user()?.roles?.[0] || 'Account' }}
      </span>
      <span class="hidden sm:inline text-borderPrimary">/</span>
      <span class="text-textPrimary">CodeClass</span>
    </div>
  </div>
  <div class="flex shrink-0 items-center gap-3 md:gap-4">
    <button
      type="button"
      class="icon-button"
      [attr.aria-label]="
        theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
      "
      (click)="theme.toggle()"
    >
      <app-icon [name]="theme.theme() === 'dark' ? 'light_mode' : 'dark_mode'" />
    </button>
    <app-notifications />
    <a routerLink="/account" class="flex items-center gap-2">
      <span
        class="w-7 h-7 rounded bg-accentSelectedBg border border-borderPrimary text-focusOutline flex items-center justify-center font-mono text-xs font-semibold"
      >
        {{ initials() }}
      </span>
      <span class="hidden sm:flex flex-col text-left">
        <span class="text-xs font-medium text-textPrimary leading-none">
          {{ auth.user()?.fullName }}
        </span>
        <span class="text-2xs text-textMuted mt-1">{{ auth.user()?.email }}</span>
      </span>
    </a>
    <button
      type="button"
      class="whitespace-nowrap text-xs text-textSecondary hover:text-statusError"
      [disabled]="signingOut()"
      (click)="logout()"
    >
      Sign out
    </button>
  </div>
</header>
