<dialog
  #dialog
  [attr.aria-label]="heading()"
  class="m-auto w-[min(94vw,48rem)] max-h-[90dvh] rounded-xl border border-borderPrimary bg-surface p-0 text-textPrimary shadow-2xl backdrop:bg-black/60"
  (cancel)="cancel($event)"
  (click)="backdrop($event)"
>
  <header class="flex items-center justify-between gap-4 border-b border-borderSubtle px-6 py-4">
    <h2 class="text-lg font-semibold">{{ heading() }}</h2>
    <button
      type="button"
      class="icon-button"
      aria-label="Close dialog"
      [disabled]="busy()"
      (click)="dismiss()"
    >
      ×
    </button>
  </header>
  <div class="p-6"><ng-content /></div>
</dialog>
