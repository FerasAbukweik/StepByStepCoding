services:
  backend:
    container_name: stepbystepcoding-backend
    build:
      context: .
      dockerfile: API/StepByStepCoding.Api/Dockerfile
    restart: unless-stopped
    environment: &backend-environment
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__ApplicationConnection: Server=sqlserver;Database=${APPLICATION_DB_NAME:?Required};User Id=sa;Password=${SA_PASSWORD:?Required};TrustServerCertificate=True
      ConnectionStrings__SecurityConnection: Server=sqlserver;Database=${SECURITY_DB_NAME:?Required};User Id=sa;Password=${SA_PASSWORD:?Required};TrustServerCertificate=True
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:?Required}
      Jwt__Key: ${JWT_KEY:?Required}
      CodeExecution__BaseUrl: ${CODE_EXECUTION_URL:?Required}
      CodeExecution__CppVersion: ${PISTON_CPP_VERSION:?Required}
      CodeExecution__PythonVersion: ${PISTON_PYTHON_VERSION:?Required}
      CodeExecution__JavaVersion: ${PISTON_JAVA_VERSION:?Required}
      AdminSeed__Enabled: ${ADMIN_SEED_ENABLED:-false}
      AdminSeed__FullName: ${ADMIN_FULL_NAME:-}
      AdminSeed__Email: ${ADMIN_EMAIL:-}
      AdminSeed__Password: ${ADMIN_PASSWORD:-}
      Cors__AllowedOrigins__0: http://localhost:${FRONTEND_PORT:-4000}
      Serilog__WriteTo__2__Args__serverUrl: http://seq:5341
    networks: [default, execution]
    volumes:
      - api_logs:/app/logs
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      seq:
        condition: service_started

  piston:
    container_name: stepbystepcoding-piston
    profiles: ["execution"]
    image: ${PISTON_IMAGE:?Required}
    restart: unless-stopped
    # Required by Piston's sandbox. Do not treat this as isolation from the Docker host.
    privileged: true
    networks: [execution]
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    environment:
      PISTON_DISABLE_NETWORKING: "true"
      PISTON_MAX_CONCURRENT_JOBS: 2
      PISTON_OUTPUT_MAX_SIZE: 16384
      PISTON_MAX_PROCESS_COUNT: 64
      PISTON_MAX_OPEN_FILES: 256
      PISTON_MAX_FILE_SIZE: 10485760
      PISTON_COMPILE_TIMEOUT: 10000
      PISTON_RUN_TIMEOUT: 3000
      PISTON_COMPILE_CPU_TIME: 10000
      PISTON_RUN_CPU_TIME: 3000
      PISTON_COMPILE_MEMORY_LIMIT: 536870912
      PISTON_RUN_MEMORY_LIMIT: 268435456
      PISTON_LIMIT_OVERRIDES: '{"java":{"run_memory_limit":536870912}}'
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /tmp:exec,size=128m
      - /var/local/lib/isolate:exec,size=256m
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:2000/api/v2/runtimes', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  piston-setup:
    container_name: stepbystepcoding-piston-setup
    profiles: ["execution"]
    image: node:24-alpine
    restart: "no"
    networks: [execution]
    environment:
      PISTON_URL: http://piston:2000
      PISTON_CPP_VERSION: ${PISTON_CPP_VERSION:?Required}
      PISTON_PYTHON_VERSION: ${PISTON_PYTHON_VERSION:?Required}
      PISTON_JAVA_VERSION: ${PISTON_JAVA_VERSION:?Required}
    volumes:
      - ./Docker/Piston/install-runtimes.mjs:/install-runtimes.mjs:ro
    command: ["node", "/install-runtimes.mjs"]
    depends_on:
      piston:
        condition: service_healthy

  migrations:
    container_name: stepbystepcoding-migrations
    profiles: ["tools"]
    build:
      context: .
      dockerfile: API/StepByStepCoding.Api/Dockerfile
      target: migrations
    environment: *backend-environment
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    container_name: stepbystepcoding-frontend
    build:
      context: ./FrontEnd/CodeClass
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4000}:80"
    depends_on:
      - backend

  sqlserver:
    container_name: stepbystepcoding-sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Required}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C -b > /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    container_name: stepbystepcoding-redis
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Required}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  seq:
    container_name: stepbystepcoding-seq
    image: datalust/seq:2025.2
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:?Required}
    ports:
      - "127.0.0.1:${SEQ_PORT:-5341}:80"
    volumes:
      - seq_data:/data

volumes:
  sqlserver_data:
  redis_data:
  seq_data:
  api_logs:
  piston_packages:

networks:
  execution:
